

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to report real
         insets on Android (edge-to-edge devices, e.g. Samsung One UI gesture bar).
         Without it those insets are 0, so bottom buttons/nav slide under the bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DealFynd | Premium Local Discovery</title>
    
    <!-- PWA & Mobile Install Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DealFynd">
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:sparkles.svg?color=%233b82f6">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">

    <!-- Google Maps is now loaded dynamically from googleMapsLoader.ts to keep API key secure -->
</head>
<body class="selection:bg-blue-500/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
