# M-AUTH-NEG-01: Signup with an invalid phone number
#
# 4-digit input must trigger inline validation and prevent the OTP request.

appId: com.dealpro.merchant
name: "M-AUTH-NEG-01: Invalid phone validation"
tags:
  - auth
  - negative
---
- launchApp:
    clearState: true
    clearKeychain: true

- tapOn: "Sign up as Merchant"

- inputText: "1234"
- tapOn: "Send OTP"

# Inline error shows; the OTP entry screen must NOT appear.
- assertVisible:
    text: "valid"
    optional: false
- assertNotVisible: "Enter the OTP"
- takeScreenshot: invalid-phone-error
