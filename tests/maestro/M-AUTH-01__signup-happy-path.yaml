# M-AUTH-01: New merchant signup with phone number (3333333333 bypass)
#
# Walks the full first-time-user journey:
#   welcome → language → location permission → invite code → login →
#   phone entry → OTP bypass → onboarding wizard
#
# Uses the auto-test bypass number 3333333333. AuthStack.tsx skips
# both the +91 starting-digit validation AND the Firebase OTP round
# trip for this number, jumping straight to the authenticated state.
#
# Screenshots are taken BEFORE assertions so we always capture state.

appId: com.dealpro.merchant
name: "M-AUTH-01: Merchant signup happy path"
tags:
  - auth
  - happy
---
- launchApp:
    clearState: true
    clearKeychain: true

# 1. Welcome screen
- extendedWaitUntil:
    visible: "JOIN"
    timeout: 15000
- takeScreenshot: 01-welcome
- assertVisible: "SIGN IN"
- assertVisible: "JOIN"
- tapOn: "JOIN"

# 2. Language selection (English is pre-selected)
- extendedWaitUntil:
    visible: "Choose your language"
    timeout: 5000
- takeScreenshot: 02-language
- assertVisible: "Choose your language"
- tapOn: "Continue"

# 3. Location permission — skip rather than allow (avoids the OS-level
#    permission prompt which Maestro can't dismiss easily on emulator)
- extendedWaitUntil:
    visible: "Enable location"
    timeout: 5000
- takeScreenshot: 03-location
- tapOn: "Skip for now"

# 4. Invite code — skip
- extendedWaitUntil:
    visible: "Enter invite code"
    timeout: 5000
- takeScreenshot: 04-invite
- tapOn: "Skip"

# 5. Login view ('Partner Success' header, phone input)
- extendedWaitUntil:
    visible: "Partner Success"
    timeout: 5000
- takeScreenshot: 05-login

# Tap the phone input field (placeholder includes 'Phone Number'),
# then type the auto-test bypass number.
- tapOn:
    text: "Phone Number"
- inputText: "3333333333"
- takeScreenshot: 06-phone-entered
- tapOn: "Continue"

# 6. Should auto-bypass OTP (no SMS round-trip for 3333333333) and
#    land on the merchant onboarding wizard. Capture whatever appears
#    so we can assert on the actual onboarding header next iteration.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07-after-login
