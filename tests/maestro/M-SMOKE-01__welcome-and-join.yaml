# M-SMOKE-01: Welcome screen renders + JOIN navigates forward
#
# Verifies the welcome screen appears and then taps JOIN to advance to
# the next screen (language_selection per App.tsx). Screenshots are
# always taken before assertions so we capture state regardless of
# pass/fail.
#
# 'Grow your business' renders with an inline <span> for "your" so
# Maestro's substring match doesn't pick up bare "Grow" — SIGN IN +
# JOIN being visible is sufficient proof the welcome screen rendered.

appId: com.dealpro.merchant
name: "M-SMOKE-01: Welcome + JOIN"
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true

# Splash auto-hides at 3000ms; welcome animations finish around ~6s.
- extendedWaitUntil:
    visible: "JOIN"
    timeout: 15000

- takeScreenshot: 01-welcome-screen
- assertVisible: "SIGN IN"
- assertVisible: "JOIN"

- tapOn: "JOIN"

# Whatever screen comes next (language_selection per App.tsx).
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-after-join-tap
