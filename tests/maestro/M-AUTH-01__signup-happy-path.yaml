# M-AUTH-01: New merchant signup with phone number (3333333333 bypass)
#
# Walks the full first-time-user journey:
#   welcome → language → location permission → invite code → login →
#   phone entry → OTP bypass → onboarding wizard
#
# Uses the auto-test bypass number 3333333333. AuthStack.tsx skips
# both the +91 starting-digit validation AND the Firebase OTP round
# trip for this number, jumping straight to the authenticated state.
#
# Screenshots are taken BEFORE assertions so we always capture state.

appId: com.dealpro.merchant
name: "M-AUTH-01: Merchant signup happy path"
tags:
  - auth
  - happy
---
- launchApp:
    clearState: true
    clearKeychain: true

# 1. Welcome screen
- extendedWaitUntil:
    visible: "JOIN"
    timeout: 15000
- takeScreenshot: 01-welcome
- assertVisible: "SIGN IN"
- assertVisible: "JOIN"
- tapOn: "JOIN"

# 2. Language selection (English is pre-selected)
- extendedWaitUntil:
    visible: "Choose your language"
    timeout: 5000
- takeScreenshot: 02-language
- assertVisible: "Choose your language"
- tapOn: "Continue"

# 3. Location permission — skip rather than allow (avoids the OS-level
#    permission prompt which Maestro can't dismiss easily on emulator)
- extendedWaitUntil:
    visible: "Enable location"
    timeout: 5000
- takeScreenshot: 03-location
- tapOn: "Skip for now"

# 4. Invite code — skip via the "I don't have an invite code" button
#    (the actual label, not a generic "Skip"). The apostrophe is a real
#    apostrophe in the rendered DOM (JSX writes &apos;).
- extendedWaitUntil:
    visible: "Enter invite code"
    timeout: 5000
- takeScreenshot: 04-invite
- tapOn: "I don't have an invite code"

# 5. Login view ('Partner Success' header, phone input)
- extendedWaitUntil:
    visible: "Partner Success"
    timeout: 5000
- takeScreenshot: 05-login

# The phone <input> has autoFocus and is the only input on the screen,
# so skip the tap (Maestro can't match input fields by placeholder text)
# and just type — keystrokes go to the focused element. Once typed,
# isPhoneValid evaluates true (digits.length === 10 for +91), which
# enables the Continue button.
- inputText: "3333333333"
- takeScreenshot: 06-phone-entered
- tapOn: "Continue"

# 6. OTP-bypassed login lands on the biometric consent screen, NOT
#    directly on the destination view. Both new signups AND returning
#    logins go through this prompt the first time on a device.
- extendedWaitUntil:
    visible: "Enable Quick Login"
    timeout: 10000
- takeScreenshot: 07-biometric-consent
- tapOn: "Not Now"

# 7. NOW we should land on the actual destination — onboarding wizard
#    for a fresh signup, dashboard for a returning user. Either way,
#    capture so we know what's there.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08-after-biometric
