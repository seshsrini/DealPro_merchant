# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Gradle JVM tuning — see comments below for rationale.
# 4 GB heap + 512 MB metaspace is comfortable for this stack (Capacitor +
# barcode scanner + Firebase + cordova plugins + Jetifier). 1.5 GB was the
# stock Capacitor default and triggered Android Studio's build-performance
# warning + occasional D8 OOMs. Drop to -Xmx3g if your machine has <16 GB RAM.
org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallel + build cache: with multiple included Capacitor plugin modules
# the parallel scheduler buys 30-50% on incremental builds. Build cache
# reuses compiled outputs across clean builds. Daemon stays alive between
# builds so JVM warmup isn't paid every time.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# cordova-plugin-printer (0.8.0) pulls in the legacy com.android.support:*:28
# libraries, which clash with AndroidX (duplicate appComponentFactory / classes).
# Jetifier rewrites those legacy support deps to AndroidX at build time, resolving
# the manifest-merger conflict. Required as long as a legacy-support Cordova plugin
# is in the project.
android.enableJetifier=true
