name: Maestro UI Tests

# Triggered from VedicJaalam dashboard via workflow_dispatch (admin-only).
# See /api/dealpro-test-plan-results/auto-test/trigger.
#
# Each step heartbeats back to:
#   ${{ inputs.report_url }}    (HMAC-SHA256 of body using ${{ inputs.report_secret }})
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   • SUPABASE_AUTO_TEST_BOT_PASSWORD   (only if a flow needs to log in via password)
#
# Required repo variables — none right now; everything specific to this run
# (run_id, callback URL, secret) flows in via workflow inputs.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'UUID of the dealpro_test_plan_runs row this workflow reports against'
        required: true
        type: string
      report_url:
        description: 'Full URL of the VedicJaalam /auto-test/report endpoint'
        required: true
        type: string
      report_secret:
        description: 'Shared HMAC-SHA256 secret used to sign callback bodies'
        required: true
        type: string

# Use the run_id as the concurrency key so that a re-trigger from the dashboard
# cancels any in-flight run for the same row (avoids interleaved callbacks).
concurrency:
  group: maestro-${{ inputs.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: merchant
  REPORT_URL: ${{ inputs.report_url }}
  REPORT_SECRET: ${{ inputs.report_secret }}
  RUN_ID: ${{ inputs.run_id }}
  # Supabase config for screenshot uploads (used by run-flows.cjs). Promoted
  # to the workflow env so they're visible inside android-emulator-runner's
  # `script:` context — that subshell does NOT inherit secrets unless the
  # secret name is referenced or the env var is exported here.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_SCREENSHOT_BUCKET: ${{ secrets.SUPABASE_SCREENSHOT_BUCKET }}

jobs:
  build-and-test:
    name: Build APK + run Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Heartbeat — run_started
        run: |
          node .github/scripts/report.cjs run_started \
            --githubRunId "$GITHUB_RUN_ID" \
            --githubRunUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --commitSha "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # @capacitor/browser@8 was compiled against JDK 21. JDK 21 also
          # builds the rest of the Capacitor 6 modules without issue.
          java-version: '21'

      - name: Install npm deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        # gradlew was committed from Windows (no executable bit). chmod here
        # rather than touching git's file mode, since this repo is developed
        # on Windows and the bit would be re-stripped on every clone.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM (for emulator perf)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # Run each .yaml under tests/maestro/ in alphabetical order. The
            # report.cjs wrapper times each flow, captures screenshots, and
            # POSTs flow_started / flow_finished back to VedicJaalam.
            node .github/scripts/run-flows.cjs

      - name: DIAG — list maestro-artifacts + supabase env (always)
        if: always()
        # Temporary diagnostic to figure out where Maestro wrote screenshots
        # and whether the Supabase env vars are present (without leaking
        # values). Remove once thumbnails reliably appear on the dashboard.
        run: |
          echo "=== ls -la maestro-artifacts/ (depth 3) ==="
          if [ -d maestro-artifacts ]; then
            find maestro-artifacts -maxdepth 3 -printf '%p (%s bytes)\n' 2>/dev/null || ls -la maestro-artifacts
          else
            echo "(maestro-artifacts/ does not exist)"
          fi
          echo ""
          echo "=== Supabase env presence (lengths only — never values) ==="
          echo "SUPABASE_URL set: $([ -n "$SUPABASE_URL" ] && echo "yes (${#SUPABASE_URL} chars)" || echo "NO")"
          echo "SUPABASE_SERVICE_ROLE_KEY set: $([ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "yes (${#SUPABASE_SERVICE_ROLE_KEY} chars)" || echo "NO")"
          echo "SUPABASE_SCREENSHOT_BUCKET: ${SUPABASE_SCREENSHOT_BUCKET:-(default: auto-test-screenshots)}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCREENSHOT_BUCKET: ${{ secrets.SUPABASE_SCREENSHOT_BUCKET }}

      - name: Upload Maestro debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_id }}
          path: maestro-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Heartbeat — run_finished (always)
        if: always()
        # MAESTRO_TOTALS is exported by run-flows.cjs to GITHUB_ENV so it's
        # available here. Falls back to zeroes if the runner died before
        # run-flows.cjs ever wrote it (e.g. APK build failed).
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failure"; fi
          TOTALS='{"total":0,"passed":0,"failed":0}'
          if [ -n "$MAESTRO_TOTALS" ]; then TOTALS="$MAESTRO_TOTALS"; fi
          node .github/scripts/report.cjs run_finished --status "$STATUS" --totals "$TOTALS"
