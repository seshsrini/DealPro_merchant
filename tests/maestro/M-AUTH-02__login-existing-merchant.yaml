# M-AUTH-02: Existing merchant login via phone + OTP
#
# Assumes M-AUTH-01 created a merchant for AUTO_TEST_PHONE earlier in the run.
# Maestro launches each flow with a fresh app state (clearState: true) so this
# verifies the login path, not just the in-memory session.

appId: com.dealpro.merchant
name: "M-AUTH-02: Existing merchant login"
tags:
  - auth
  - happy
---
- launchApp:
    clearState: true
    clearKeychain: true

- assertVisible: "Login"
- tapOn: "Login"

- inputText: ${AUTO_TEST_PHONE}
- tapOn: "Send OTP"

- assertVisible: "Enter the OTP"
- inputText: ${AUTO_TEST_OTP}
- tapOn: "Verify"

# Lands directly on the merchant dashboard (skips onboarding for existing user)
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 15000
- takeScreenshot: dashboard-landed
