# M-SMOKE-01: App launches and renders something
#
# Diagnostic-first smoke test — captures screenshots at multiple points
# during launch with NO assertions. Always passes. Use the screenshots
# uploaded to Supabase (visible on the dashboard report page) to figure
# out what the launch sequence actually looks like, then add real
# assertions in a follow-up flow.

appId: com.dealpro.merchant
name: "M-SMOKE-01: App launches (diagnostic)"
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true

# 1s after launch — should still be on splash
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: 01-after-launch

# 4s after launch — splash autohide is 3000ms, should be on welcome
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02-after-4s

# 10s after launch — welcome screen should be fully rendered (animations done)
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 03-after-10s
